apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:7
          command:
            - /bin/bash
            - -c
            - |
              set -e
              for host in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
                echo "Waiting for ${host}:27017..."
                until mongosh --host "${host}:27017" --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
                  sleep 3
                done
                echo "${host}:27017 is reachable."
              done

              echo "Initiating replica set rs0..."
              mongosh --host mongo-0.mongo:27017 --quiet --eval '
                try {
                  const status = rs.status();
                  print("Replica set already initialized: " + status.set);
                } catch (e) {
                  const res = rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo:27017" },
                      { _id: 1, host: "mongo-1.mongo:27017" },
                      { _id: 2, host: "mongo-2.mongo:27017" }
                    ]
                  });
                  printjson(res);
                }
              '

              sleep 5
              echo "Current replica set members:"
              mongosh --host mongo-0.mongo:27017 --quiet --eval '
                rs.status().members.forEach(m => print(m.name + " -> " + m.stateStr))
              '
